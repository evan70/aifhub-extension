schema: aifhub.memory_tools.recommendation.v1
updated: "2026-05-25"
purpose: "Метаданные для этапа анализа проекта: какие memory/retrieval инструменты можно предлагать пользователю, когда и с какими ограничениями."
default_policy:
  install_policy: explicit_user_opt_in_only
  never_auto_install: true
  require_explicit_paths: true
  require_purge_path: true
  baseline_tool: rg
  privacy_rule: "Не предлагать инструмент, если read scope не ограничен или purge path не проверен."
skill_usage_matrix:
  aif-analyze:
    allowed:
      - rg
      - graphify
      - context7
      - codex-agent-mem
      - context-mode
      - codegraph
    forbidden:
      - codex-mem
      - eagle-mem
    notes: "Recommend only; do not install, setup, index, register MCP, mutate provider config, or treat provider output as evidence."
  aif-explore:
    allowed:
      - rg
      - graphify
      - context7
      - codex-agent-mem
      - context-mode
      - codegraph
    forbidden:
      - codex-mem
      - eagle-mem
    notes: "Read existing reviewed provider output, or use explicitly enabled tools only when metadata grants command-specific permission and purge is defined."
  aif-plan:
    allowed:
      - rg
      - graphify
      - context7
    forbidden:
      - codex-agent-mem
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
    notes: "Optional supporting context before writing canonical OpenSpec artifacts; final plan must use direct repository evidence."
  aif-review:
    allowed:
      - rg
      - graphify
      - context7
      - codex-agent-mem
    forbidden:
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
    notes: "Optional supporting context for impact/docs/closure checks only."
  aif-rules-check:
    allowed:
      - rg
      - context7
    forbidden:
      - graphify
      - codex-agent-mem
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
    notes: "Context7 may support version-sensitive external docs only; generated rules and source evidence remain authoritative."
  aif-implement:
    allowed:
      - rg
    forbidden:
      - graphify
      - context7
      - codex-agent-mem
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
    notes: "Implementation commands must not use optional context providers by default."
  aif-fix:
    allowed:
      - rg
    forbidden:
      - graphify
      - context7
      - codex-agent-mem
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
    notes: "Fix commands must use QA evidence, source files, and canonical OpenSpec context."
  aif-verify:
    allowed:
      - rg
    forbidden:
      - graphify
      - context7
      - codex-agent-mem
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
    notes: "Verification must stay source-grounded and provider-independent."
  aif-done:
    allowed:
      - rg
    forbidden:
      - graphify
      - context7
      - codex-agent-mem
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
    notes: "Done/finalization must not depend on optional provider availability or output."
  aif-commit:
    allowed:
      - rg
    forbidden:
      - graphify
      - context7
      - codex-agent-mem
      - context-mode
      - codex-mem
      - eagle-mem
      - codegraph
    notes: "Commit freshness checks may use direct repository and local artifact evidence only."
permissions:
  recommend_only:
    description: "May suggest manual usage; cannot run setup, indexing, MCP registration, sync, hooks, or background services."
  read_existing_reviewed_output:
    description: "May read already-created reviewed notes or reports from allowed paths."
  safe_availability_probe:
    description: "May run local non-mutating --version, --help, doctor, or status probes."
  manual_user_owned_execution:
    description: "User may run manually outside AIFHub command ownership."
  manual_purged_cli_execution:
    description: "May run a scoped CLI lifecycle against an explicit project path only when the selection CLI returns the tool for this command, then purge the tool-owned local index before finishing."
  forbidden:
    description: "Do not suggest or use for this command."
tool_permissions:
  rg:
    aif-analyze: safe_availability_probe
    aif-explore: safe_availability_probe
    aif-plan: safe_availability_probe
    aif-review: safe_availability_probe
    aif-rules-check: safe_availability_probe
    aif-implement: safe_availability_probe
    aif-fix: safe_availability_probe
    aif-verify: safe_availability_probe
    aif-done: safe_availability_probe
    aif-commit: safe_availability_probe
  graphify:
    aif-analyze: recommend_only
    aif-explore: read_existing_reviewed_output
    aif-plan: read_existing_reviewed_output
    aif-review: read_existing_reviewed_output
    aif-rules-check: forbidden
    aif-implement: forbidden
    aif-fix: forbidden
    aif-verify: forbidden
    aif-done: forbidden
    aif-commit: forbidden
  context7:
    aif-analyze: recommend_only
    aif-explore: read_existing_reviewed_output
    aif-plan: read_existing_reviewed_output
    aif-review: read_existing_reviewed_output
    aif-rules-check: read_existing_reviewed_output
    aif-implement: forbidden
    aif-fix: forbidden
    aif-verify: forbidden
    aif-done: forbidden
    aif-commit: forbidden
  codex-agent-mem:
    aif-analyze: recommend_only
    aif-explore: read_existing_reviewed_output
    aif-plan: forbidden
    aif-review: read_existing_reviewed_output
    aif-rules-check: forbidden
    aif-implement: forbidden
    aif-fix: forbidden
    aif-verify: forbidden
    aif-done: forbidden
    aif-commit: forbidden
  context-mode:
    aif-analyze: recommend_only
    aif-explore: recommend_only
    aif-plan: forbidden
    aif-review: forbidden
    aif-rules-check: forbidden
    aif-implement: forbidden
    aif-fix: forbidden
    aif-verify: forbidden
    aif-done: forbidden
    aif-commit: forbidden
  agent-memory:
    default: recommend_only_if_user_requests_manual_notes
  codex-mem:
    default: forbidden
  eagle-mem:
    default: forbidden
  codegraph:
    aif-analyze: recommend_only
    aif-explore: manual_purged_cli_execution
    default: forbidden
availability_probes:
  rg:
    - rg --version
  uv:
    - uv --version
  graphify:
    - graphify --version
    - graphify --help
  context7:
    - ctx7 --version
    - npx --no-install ctx7 --help
  codex-agent-mem:
    - codex-agent-mem-policy --help
    - codex-agent-mem-smoke --help
  context-mode:
    - context-mode doctor
  codegraph:
    - codegraph --version
    - codegraph --help
    - codegraph status
forbidden_operations:
  - auto_install
  - auto_run_setup
  - auto_index_source
  - auto_sync_memory
  - auto_register_mcp
  - mutate_provider_config
  - install_hooks
  - start_background_daemons
  - rewrite_validation_artifacts
protected_artifacts:
  - aif-gate-result
  - coverage.json
  - done-readiness.json
  - openspec/specs/**
  - openspec/changes/**/specs/**
  - .ai-factory/rules/generated/openspec-rules-trace-*.json
  - exact evidence snippets
project_shape_signals:
  large_legacy:
    description: "Большой legacy проект с плотными интеграциями, большим числом файлов и шумным literal search."
    conditional_tools:
      - graphify
      - codegraph
    condition: "Предлагать только после baseline rg, если literal search даёт слишком много шума или нужен architecture/impact overview."
    avoid_tools:
      - codex-mem
      - eagle-mem
  multirepo:
    description: "Работа идёт сразу по нескольким репозиториям или нужно понять surface между компонентами."
    suggest_tools:
      - graphify
      - codegraph
    conditional_tools:
      - codex-agent-mem
    avoid_tools:
      - codex-mem
      - eagle-mem
  large_framework_app:
    description: "Крупное web-приложение на framework stack, где нужны architecture/impact вопросы."
    suggest_tools:
      - graphify
      - codegraph
    conditional_tools:
      - context-mode
  go_service:
    description: "Средний Go сервис с интеграциями."
    conditional_tools:
      - graphify
      - codegraph
      - codex-agent-mem
    baseline_first:
      - rg
  small_microservice:
    description: "Малый сервис, где точный поиск обычно быстрее любых индексов."
    suggest_tools: []
    baseline_first:
      - rg
    avoid_tools:
      - graphify
      - codegraph
      - context-mode
      - codex-mem
      - agent-memory
      - eagle-mem
task_signals:
  exact_file_or_symbol_lookup:
    recommend:
      - rg
    avoid:
      - graphify
      - codegraph
      - context-mode
  architecture_or_impact_discovery:
    recommend:
      - graphify
      - codegraph
  multirepo_surface_mapping:
    recommend:
      - graphify
      - codegraph
  resume_previous_work:
    recommend:
      - codex-agent-mem
  open_work_or_completion_check:
    recommend:
      - codex-agent-mem
  large_command_output_compression:
    recommend:
      - context-mode
  version_sensitive_library_docs:
    recommend:
      - context7
  manual_durable_notes:
    conditional:
      - agent-memory
  codex_history_search:
    avoid_by_default:
      - codex-mem
tools:
  graphify:
    display_name: Graphify
    doc: graphify.md
    repository: "https://github.com/safishamsi/graphify"
    tested_version: "graphifyy 0.8.17"
    decision: optional
    recommendation_action: suggest_optional_install
    integration_role: repo_graph_provider
    install_policy: explicit_user_opt_in_only
    stable_cli: true
    mcp_status: works_after_installing_python_mcp
    read_scope: explicit_project_path
    purge_path: "delete graphify-out/ or run graphify uninstall --purge if installed"
    allowed_in:
      - aif-analyze
      - aif-explore
      - aif-plan
      - aif-review
    forbidden_in:
      - aif-rules-check
      - aif-implement
      - aif-fix
      - aif-verify
      - aif-done
      - aif-commit
    privacy_caveat: "Reads only an explicit project path, but generated graph output can contain source-derived structure and must be reviewed before storage."
    recommended_for:
      project_shapes:
        - multirepo
        - large_framework_app
      tasks:
        - architecture_or_impact_discovery
        - multirepo_surface_mapping
        - token_reduction_for_broad_codebase_questions
    conditional_for:
      project_shapes:
        - large_legacy
        - go_service
      condition: "Только после baseline rg и только для broad architecture/impact вопросов, не для exact lookup."
    do_not_recommend_for:
      project_shapes:
        - small_microservice
      tasks:
        - exact_file_or_symbol_lookup
        - durable_session_memory
    suggestion_text: "Проект выглядит как large framework или multirepo; можно предложить Graphify как optional repo graph для architecture/impact анализа после baseline поиска через rg. Для legacy/go предлагать только если rg слишком шумный."
    execution:
      default:
        mode: read_existing_reviewed_output
        allowed_paths:
          - graphify-out/GRAPH_REPORT.md
          - graphify-out/graph.json
          - .ai-factory/references/graphify/GRAPH_REPORT.md
          - .ai-factory/state/<change-id>/graphify/GRAPH_REPORT.md
        forbidden_commands:
          - graphify install
          - graphify .
        notes: "Read existing reviewed reports only unless the user runs Graphify outside AIFHub command ownership."
  codex-agent-mem:
    display_name: codex-agent-mem
    doc: codex-agent-mem.md
    repository: "https://github.com/MarceloCaporale/codex-agent-mem"
    tested_version: "Python source package 1.0.2 from GitHub"
    decision: optional
    recommendation_action: suggest_when_continuity_needed
    integration_role: read_only_continuity_memory
    install_policy: explicit_user_opt_in_only
    stable_cli: source_installable_from_github_and_cli_help_verified
    mcp_status: source_install_and_read_only_minimal_mcp_verified
    read_scope: explicit_sqlite_db_path
    purge_path: "delete configured SQLite DB and sidecar files"
    allowed_in:
      - aif-analyze
      - aif-explore
      - aif-review
    forbidden_in:
      - aif-plan
      - aif-rules-check
      - aif-implement
      - aif-fix
      - aif-verify
      - aif-done
      - aif-commit
    privacy_caveat: "Reads only the configured SQLite memory DB in read-only/minimal mode; it is not a source code index and cannot satisfy OpenSpec gates. Use minimal profile by default; full read-only lists mutating tool names even though mutating calls return isError and do not write."
    recommended_for:
      tasks:
        - resume_previous_work
        - open_work_or_completion_check
        - compact_handoff_context
    conditional_for:
      project_shapes:
        - multirepo
        - large_legacy
        - go_service
      condition: "Есть prior memory DB или пользователь хочет continuity между сессиями."
    do_not_recommend_for:
      tasks:
        - initial_code_discovery
        - exact_file_or_symbol_lookup
        - architecture_graphing
    suggestion_text: "Если нужен resume/open-work context между сессиями, можно предложить codex-agent-mem в read-only minimal MCP mode с explicit DB path. Install/setup остается user-owned; package source is GitHub/Python, not npm."
    execution:
      default:
        mode: read_existing_reviewed_output
        requires_explicit_path: true
        notes: "Read only the configured SQLite DB or reviewed continuity notes. Prefer codex-agent-mem-mcp --read-only --profile minimal --response-mode compact; do not use full profile as the default low-impact mode."
  context-mode:
    display_name: context-mode
    doc: context-mode.md
    repository: "https://github.com/mksglu/context-mode"
    tested_version: "1.0.151"
    decision: manual_helper_only
    recommendation_action: suggest_only_for_large_temporary_outputs
    integration_role: temporary_output_index
    install_policy: explicit_user_opt_in_only
    stable_cli: partial
    mcp_status: verified
    read_scope: explicit_indexed_content
    purge_path: "ctx_purge with session or project scope"
    allowed_in:
      - aif-analyze
      - aif-explore
    forbidden_in:
      - aif-plan
      - aif-review
      - aif-rules-check
      - aif-implement
      - aif-fix
      - aif-verify
      - aif-done
      - aif-commit
    privacy_caveat: "Everything explicitly indexed becomes retrievable; never compress protected validation artifacts in place and always purge temporary content."
    recommended_for:
      tasks:
        - large_command_output_compression
        - temporary_one_session_retrieval
    do_not_recommend_for:
      tasks:
        - persistent_project_memory
        - source_code_indexing
      project_shapes:
        - small_microservice
    suggestion_text: "Если анализ генерирует очень большой output, можно предложить context-mode как manual temporary index с обязательным purge."
    execution:
      default:
        mode: recommend_only
        notes: "Recommend temporary explicit-output indexing only; do not compress protected artifacts in place."
  context7:
    display_name: Context7
    doc: context7.md
    repository: "https://github.com/upstash/context7"
    tested_version: "ctx7 0.4.4"
    decision: optional
    recommendation_action: suggest_for_version_sensitive_docs
    integration_role: optional_docs_provider
    install_policy: explicit_user_opt_in_only
    stable_cli: true_for_help_and_lookup
    mcp_status: user_configured_optional
    read_scope: explicit_library_or_docs_query
    purge_path: "delete reviewed notes under .ai-factory/references/context7/ or .ai-factory/state/<change-id>/context7/"
    allowed_in:
      - aif-analyze
      - aif-explore
      - aif-plan
      - aif-review
      - aif-rules-check
    forbidden_in:
      - aif-implement
      - aif-fix
      - aif-verify
      - aif-done
      - aif-commit
    privacy_caveat: "Queries external documentation by explicit library/query only; do not persist API keys, raw MCP transcripts, or provider diagnostics."
    recommended_for:
      tasks:
        - version_sensitive_library_docs
        - framework_migration_or_deprecation_check
    do_not_recommend_for:
      tasks:
        - canonical_openspec_evidence
        - validation_gate
        - automatic_mcp_registration
    suggestion_text: "Если вопрос зависит от актуальных library/API docs, можно предложить Context7 как optional docs provider; setup и MCP registration остаются user-owned."
    execution:
      default:
        mode: read_existing_reviewed_output
        allowed_paths:
          - .ai-factory/references/context7/
          - .ai-factory/state/<change-id>/context7/
        notes: "Use configured docs tools or reviewed notes only; do not run setup or mutate MCP config."
  codex-mem:
    display_name: codex-mem
    doc: codex-mem.md
    repository: "https://github.com/Just-Boring-Cat/codex-mem"
    tested_version: "0.1.1"
    decision: reject_default
    recommendation_action: do_not_suggest_install_by_default
    integration_role: none
    install_policy: do_not_auto_install
    stable_cli: true
    mcp_status: verified_but_unsafe_by_default
    read_scope: broad_codex_history_unless_fully_isolated
    purge_path: "delete configured SQLite DB and sidecar files"
    allowed_in: []
    forbidden_in:
      - aif-analyze
      - aif-explore
      - aif-plan
      - aif-review
      - aif-rules-check
      - aif-implement
      - aif-fix
      - aif-verify
      - aif-done
      - aif-commit
    privacy_caveat: "Default scope can ingest broad Codex history across projects unless fully isolated."
    avoid_reason: "Default scope может ingest cross-project Codex history; isolation слишком fragile для default recommendation."
  agent-memory:
    display_name: agent-memory
    doc: agent-memory.md
    repository: "https://github.com/jayzeng/agentmemory"
    tested_version: "myagentmemory 0.4.12"
    decision: docs_only_manual_notes
    recommendation_action: mention_only_if_user_requests_manual_notes
    integration_role: manual_markdown_memory
    install_policy: explicit_user_opt_in_only
    stable_cli: partial_on_windows
    mcp_status: not_found
    read_scope: explicit_memory_dir
    purge_path: "delete selected memory directory"
    allowed_in:
      - manual_notes_only
    forbidden_in:
      - aif-analyze_without_manual_notes_request
      - aif-plan
      - aif-review
      - aif-rules-check
      - aif-implement
      - aif-fix
      - aif-verify
      - aif-done
      - aif-commit
    privacy_caveat: "Manual markdown notes in an explicit directory only; not a code retrieval or MCP provider."
    recommended_for:
      tasks:
        - manual_durable_notes
    do_not_recommend_for:
      tasks:
        - codebase_retrieval
        - project_analysis
        - mcp_provider_integration
    suggestion_text: "Предлагать только как ручной markdown notebook, если пользователь сам просит durable notes."
  eagle-mem:
    display_name: eagle-mem
    doc: eagle-mem.md
    repository: "https://github.com/eagleisbatman/eagle-mem"
    tested_version: "4.9.10"
    decision: reject_defer
    recommendation_action: do_not_suggest_install
    integration_role: none
    install_policy: do_not_auto_install
    stable_cli: partial_on_windows
    mcp_status: not_proven
    read_scope: not_proven
    purge_path: not_proven
    allowed_in: []
    forbidden_in:
      - aif-analyze
      - aif-explore
      - aif-plan
      - aif-review
      - aif-rules-check
      - aif-implement
      - aif-fix
      - aif-verify
      - aif-done
      - aif-commit
    privacy_caveat: "Scoped read and purge are not proven, and lifecycle surface includes hooks/background lanes."
    avoid_reason: "Слишком широкий lifecycle surface: hooks, background lanes, user-home runtime и неvalidated purge/read scope."
  codegraph:
    display_name: CodeGraph
    doc: codegraph.md
    repository: "https://github.com/colbymchenry/codegraph"
    tested_version: "installed @colbymchenry/codegraph 0.9.3; npm latest 0.9.4 on 2026-05-24"
    decision: manual_cli_only
    recommendation_action: suggest_manual_cli_for_repo_graph_when_enabled_or_explicit
    integration_role: manual_cli_repo_graph_provider
    install_policy: explicit_user_opt_in_only
    stable_cli: verified_for_version_help_status_init_index_query_uninit
    mcp_status: not_enabled
    read_scope: explicit_project_path_verified_for_cli_init_index_status_query
    purge_path: "codegraph uninit --force <project> verified"
    allowed_in:
      - aif-analyze
      - aif-explore
    forbidden_in:
      - aif-plan
      - aif-review
      - aif-rules-check
      - aif-implement
      - aif-fix
      - aif-verify
      - aif-done
      - aif-commit
    privacy_caveat: "Local CLI indexing creates .codegraph/ under the explicit project path until purged; install/MCP/agent configuration mutation surfaces are not accepted."
    recommended_for:
      project_shapes:
        - multirepo
        - large_framework_app
      tasks:
        - architecture_or_impact_discovery
        - multirepo_surface_mapping
    conditional_for:
      project_shapes:
        - large_legacy
        - go_service
      condition: "Только после baseline rg, только для broad repo graph questions, and only with explicit project path plus purge."
    do_not_recommend_for:
      project_shapes:
        - small_microservice
      tasks:
        - exact_file_or_symbol_lookup
        - validation_gate
        - implementation
        - automatic_mcp_registration
    suggestion_text: "Для broad architecture/impact или multirepo mapping можно предложить CodeGraph как manual CLI-only repo graph: probe, run explicit path init/index/query, then purge with codegraph uninit --force <project>. Do not run codegraph install, sync, serve, serve --mcp, or mutate agent config."
    execution:
      aif-explore:
        mode: manual_purged_cli_execution
        safe_probes:
          - codegraph --version
          - codegraph --help
          - codegraph status
        commands:
          - codegraph init <project>
          - codegraph index --quiet <project>
          - codegraph query --path <project> --limit 10 --json "<query>"
          - codegraph uninit --force <project>
        purge:
          - codegraph uninit --force <project>
        forbidden_commands:
          - codegraph install
          - codegraph sync
          - codegraph serve
          - codegraph serve --mcp
        pre_existing_state: "If .codegraph/ already exists, treat it as user-owned and do not delete or reinitialize it silently."
evidence_runs:
  - id: local-anonymous-profiles-2026-05-22
    date: "2026-05-22"
    scope: "13 anonymous local project profiles with .ai-factory/ARCHITECTURE.md, copied to sanitized temp fixtures before testing."
    privacy: "Docs contain only anonymous profile ids and project shape labels; real project names and local paths are excluded."
    sanitization:
      excluded:
        - ".git"
        - ".env*"
        - "node_modules"
        - "vendor"
        - "logs/cache/build artifacts"
        - "lock files"
        - "binary/media/data artifacts"
    profile_counts:
      go_service: 1
      large_framework_app: 4
      large_legacy: 1
      multirepo: 3
      small_microservice: 4
    baseline:
      tool: rg
      scenario: "common architecture/source terms"
      token_estimate_method: "ceil(chars / 4)"
    outcomes:
      graphify:
        tested_profiles: 13
        good: 7
        partial: 2
        poor: 4
        recommendation_update: "Предлагать для large_framework_app и multirepo broad analysis; для go_service/large_legacy только после rg; не предлагать для small_microservice."
      codex-agent-mem:
        tested_profiles: 13
        smoke_passed: 13
        mcp_read_only_passed: 13
        recommendation_update: "Project shape не влияет; предлагать только для continuity с explicit DB path."
      context-mode:
